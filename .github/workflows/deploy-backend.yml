name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        id: image
        run: echo "image=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build --platform linux/amd64 -f backend/Dockerfile -t "${{ steps.image.outputs.image }}" backend
          docker push "${{ steps.image.outputs.image }}"

  deploy-prod:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPO }}:${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          envs: DEPLOY_IMAGE
          script: |
            set -e
            cd /root/fscape
            test -f docker-compose.yml
            test -f .env
            test -n "$DEPLOY_IMAGE"
            echo "Deploying $DEPLOY_IMAGE"
            docker compose --env-file .env pull
            docker compose --env-file .env up -d --remove-orphans || {
              docker compose ps
              docker logs --tail=200 fscape-api || true
              docker logs --tail=120 fscape-cron || true
              docker logs --tail=120 fscape-worker || true
              exit 1
            }
            docker image prune -f
